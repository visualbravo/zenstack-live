name: zenstack-live

volumes:
  postgres-data:
  mysql-data:
  redis-data:
  redis-insight-data:

networks:
  workspace:
    external: false

services:
  postgres:
    container_name: zenstack-live-postgres
    image: postgres:15.0
    volumes:
      - postgres-data:/var/lib/postgresql/data
    env_file: ./.env
    networks:
      - workspace

    command:
      - 'postgres'
      - '-c'
      - 'wal_level=logical'

    ports:
      - 5432:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5

  mysql:
    container_name: zenstack-live-mysql
    image: mysql:8.0
    volumes:
      - mysql-data:/var/lib/mysql
    env_file: ./.env
    networks:
      - workspace

    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON

    ports:
      - 3306:3306
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-u', 'root', '-p zenstack']
      interval: 5s
      timeout: 5s
      retries: 5

  zebezium-postgres:
    container_name: zenstack-live-zebezium-postgres
    build:
      context: ../zebezium
      dockerfile: ./Dockerfile
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://zenstack:zenstack@postgres:5432/zenstack
      - REDIS_URL=redis://redis:6379
    networks:
      - workspace
    ports:
      - 8080:8080
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/q/health']
      interval: 5s
      timeout: 5s
      retries: 5

  zebezium-mysql:
    container_name: zenstack-live-zebezium-mysql
    build:
      context: ../zebezium
      dockerfile: ./Dockerfile
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=mysql://root:zenstack@mysql:3306/zenstack
      - REDIS_URL=redis://redis:6379
    networks:
      - workspace
    ports:
      - 8081:8080
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/q/health']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: zenstack-live-redis
    image: redis:7.2
    volumes:
      - redis-data:/data
    command: redis-server --maxmemory-policy noeviction --appendonly yes
    networks:
      - workspace
    ports:
      - 6379:6379
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 5

  workspace:
    container_name: zenstack-live-workspace
    image: mcr.microsoft.com/devcontainers/javascript-node:22
    ports:
      - 3000:3000
    volumes:
      - ..:/workspace:cached
    env_file: ./.env
    command: sleep infinity
    networks:
      - workspace

  redis-insight:
    container_name: zenstack-live-redis-insight
    image: redis/redisinsight:3.0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - workspace
    ports:
      - 5540:5540
    volumes:
      - redis-insight-data:/data
